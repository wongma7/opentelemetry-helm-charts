---
# Source: opentelemetry-kube-stack/templates/exporters/kube-proxy/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: example-kube-proxy
  namespace: default
  labels:
    app: opentelemetry-kube-stack-kube-proxy
    helm.sh/chart: opentelemetry-kube-stack-0.22.0
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    release: "example"
spec:
  jobLabel: jobLabel
  
  selector:
    matchLabels:
      app: opentelemetry-kube-stack-kube-proxy
      release: "example"
  namespaceSelector:
    matchNames:
      - "kube-system"
  endpoints:
  - port: http-metrics
    authorization:
      credentials:
        key: token
        name: 'example-daemon-collector-token'
      type: Bearer
